version: '3.2'
services:
  app:
    build: ./
    ports:
      # 宿主机 9511 -> 容器 9501（容器内监听端口与框架 config/server.php 一致保持 9501，
      # 宿主端口避开 api-php 项目的 youqu-php:9501，避免端口冲突无法启动）
      - "9511:9501"
    volumes:
      - ./:/var/www/app
    environment:
      - TZ=Asia/Shanghai
      - REDIS_HOST=redis
    # 保持容器运行
    command: [ "tail", "-f", "/dev/null" ]
  mysql:
    image: mysql:latest
    restart: always
    volumes:
      # MySQL 官方镜像数据目录为 /var/lib/mysql（此前误挂 /data 导致数据不持久化）
      - mysql:/var/lib/mysql
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: "123456"  # 将密码设置为一个键值对
  redis:
    image: redis:latest
    ports:
      - "6380:6379"
    volumes:
      - redis:/data
    environment:
      - TZ=Asia/Shanghai
volumes:
  mysql:
  redis:
